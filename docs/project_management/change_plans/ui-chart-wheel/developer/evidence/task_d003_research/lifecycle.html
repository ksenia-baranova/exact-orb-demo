<!doctype html><html lang="ru"><meta charset="utf-8"><title>D003 proposed port controls</title>
<style>body{font:16px 'Segoe UI',sans-serif;color:#182d49;margin:16px}button{min-width:44px;min-height:44px}svg{border:1px solid #abc}table{font-size:12px}td{padding:3px}#error{color:#a11}button:focus-visible,[role=button]:focus{outline:2px solid black}</style>
<h1>Изолированный port: одни факты, два renderer</h1><p id="summary"></p><p id="error"></p><div id="image"></div><div id="facts"></div><p id="selection"></p>
<script type="module">
const fixtures=await(await fetch('./fixtures.json')).json(),$=id=>document.getElementById(id),trace=[];let generation=0,current=null,selected=null,chart=null;
function html(dto){$('summary').textContent=dto.chart_identity;$('facts').replaceChildren();const t=document.createElement('table');t.dataset.identity=dto.chart_identity;for(const p of dto.points){const r=t.insertRow();for(const v of [p.id,p.longitude,p.degree,p.minute,p.sign,p.retrograde])r.insertCell().textContent=String(v)}for(const a of dto.aspects){const r=t.insertRow();for(const v of [a.from,a.to,a.type,a.category,a.orb])r.insertCell().textContent=String(v)}$('facts').append(t)}
function port(style){return{mount({host,dto,onActivate}){if(style==='fault'){trace.push({event:'fault-hook',identity:dto.chart_identity});throw Error('controlled SVG leaf failure')}const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('width','300');svg.setAttribute('height','70');host.append(svg);const n=document.createElementNS(svg.namespaceURI,'g');n.setAttribute('tabindex','0');n.setAttribute('role','button');n.id='live-renderer';n.dataset.key='sun';const r=document.createElementNS(svg.namespaceURI,'rect');for(const[k,v]of Object.entries({x:10,y:10,width:44,height:44,fill:style==='alternate'?'#ccddfa':'#ddffdd'}))r.setAttribute(k,v);n.append(r);const text=document.createElementNS(svg.namespaceURI,'text');text.setAttribute('x',18);text.setAttribute('y',40);text.textContent=style==='alternate'?'☉':'S';text.setAttribute('pointer-events','none');n.append(text);svg.append(n);const handler=()=>onActivate({kind:'point',id:'sun'});n.onclick=handler;n.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();handler()}};trace.push({event:'mounted',style,identity:dto.chart_identity});return{late:handler,update(){trace.push({event:'update',style})},dispose(){n.onclick=null;n.onkeydown=null;svg.remove();trace.push({event:'disposed',style})}}}}}
function accept(dto,style='default'){html(dto);chart=structuredClone(dto);current?.dispose();current=null;const token=++generation;$('image').replaceChildren();$('error').textContent='';try{current=port(style).mount({host:$('image'),dto:chart,onActivate(intent){if(token!==generation){trace.push({event:'late-ignored',token,current:generation});return}selected=selected===intent.id?null:intent.id;$('selection').textContent=selected??'none';trace.push({event:'activation',identity:chart.chart_identity,intent,selected,token})}});return{kind:'rendered',token}}catch(error){$('image').replaceChildren();$('error').textContent='SVG unavailable; confirmed HTML retained';trace.push({event:'local-unavailable',identity:chart.chart_identity,message:error.message});return{kind:'svg_unavailable',token}}}
const A=structuredClone(fixtures.F1),B=structuredClone(fixtures.F1);B.chart_identity='controlled-B-confirmed';B.points[0].longitude=12.25;B.points[0].sign='Aries';B.points[0].degree=12;B.points[0].minute=15;B.aspects[0].orb=2.75;window.portResearch={ready:true,A,B,accept,trace,get current(){return current},get selected(){return selected},snapshot(){return{identity:$('facts').querySelector('table').dataset.identity,point:$('facts').querySelector('tr').textContent,html:$('facts').textContent,summary:$('summary').textContent,error:$('error').textContent,imageCount:$('image').children.length,selected,trace:structuredClone(trace)}}};
</script></html>
