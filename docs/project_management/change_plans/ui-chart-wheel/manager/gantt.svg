<text x="50" y="846" font-size="17">Developer 8–12 чд включает подготовку / ADR / spike до 0,75 чд; время spike не прибавляется повторно.</text>
<text x="50" y="875" font-size="17">Реализация — после G3; тестирование — после G4. Верхняя оценка Developer условна до измерений.</text>
<text x="50" y="904" font-size="16" style="fill:#586879">Не включены Manager / Analyst / Technical Reviewer, ожидания, дополнительные reviews, приёмка и чистовой перенос.</text>
