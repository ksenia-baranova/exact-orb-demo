<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>exact orb — прототип web-версии</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Manrope:wght@400;500;600&family=Noto+Sans+Symbols&family=Noto+Sans+Symbols+2&display=swap">
<style>
:root{
  --bg:#080706;--card:#15110E;--card2:#1C1712;--gold:#F0CD73;--gold2:#E0B357;--red:#D07B58;
  --muted:#B8AA97;--text:#F3EADB;--line:rgba(224,179,87,.22);--line2:rgba(224,179,87,.12);
  --on-gold:#2A1E08;--radius:14px;
  --display:"Jost",system-ui,sans-serif;--body:"Manrope",system-ui,sans-serif;
  --sym:"Noto Sans Symbols","Noto Sans Symbols 2","Segoe UI Symbol","Apple Symbols",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:96px}
body{margin:0;background:var(--bg);color:var(--muted);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--gold)}a:hover{color:var(--gold2)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.sym{font-family:var(--sym);font-variant-emoji:text}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-family:var(--display);font-weight:400;color:var(--gold);margin:0;letter-spacing:-.005em}
h1{font-size:clamp(30px,4.2vw,52px);line-height:1.05}
h2{font-size:24px;line-height:1.2}
h3{font-size:18px;line-height:1.3}
p{margin:0}

.top{position:sticky;top:0;z-index:20;background:rgba(8,7,6,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line2);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1280px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;gap:16px}
.logo{white-space:nowrap;display:flex;align-items:center;gap:10px;color:var(--gold);text-decoration:none;font:400 22px var(--display)}
.logo:hover{color:var(--gold)}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--red);color:var(--red);border-radius:999px;padding:3px 10px;font-size:12px;white-space:nowrap}
.badge.m2{padding:1px 8px;font-size:11px}
.spacer{flex:1}
.textbtn{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 6px;background:none;border:0;color:var(--gold);cursor:pointer;text-decoration:none;font-size:14px}

.wrap{max-width:1280px;margin:0 auto;padding:40px 32px 96px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:var(--radius);font-weight:600;font-size:16px;cursor:pointer;text-decoration:none;border:1px solid transparent}
.btn.primary{background:var(--gold);color:var(--on-gold)}
.btn.primary:hover{background:#F5D98C;color:var(--on-gold)}
.btn.secondary{background:transparent;border-color:rgba(240,205,115,.55);color:var(--gold);font-weight:500}
.btn.secondary:hover{background:rgba(240,205,115,.06)}
.btn[aria-busy=true]{cursor:progress;opacity:.85}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:14px;cursor:pointer;text-decoration:none}
.chip:hover{border-color:rgba(240,205,115,.5);color:var(--text)}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.note{display:flex;gap:12px;padding:16px;border-radius:var(--radius);border:1px dashed rgba(240,205,115,.45);background:var(--card)}
.note b{color:var(--text);font-weight:500;display:block}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(42,30,8,.3);border-top-color:var(--on-gold);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

/* Э1 input */
.intro{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:64px;align-items:start}
.lede{margin-top:14px;font-size:17px;max-width:46ch}
.form{margin-top:32px;padding:28px;display:flex;flex-direction:column;gap:20px}
.field{display:flex;flex-direction:column;gap:6px;position:relative}
.field label,.flabel{font-size:14px;color:var(--text)}
.req{color:var(--red)}
.inp{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border-radius:12px;background:var(--bg);border:1px solid rgba(224,179,87,.35)}
.inp:focus-within{border-color:var(--gold)}
.inp.err{border-color:var(--red)}
.inp input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--text);font:16px var(--body);padding:0}
.inp input::placeholder{color:#8C8070}
.hint{font-size:13px}
.error{font-size:13px;color:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.check{display:flex;gap:12px;align-items:flex-start;min-height:44px;padding-top:4px;cursor:pointer;color:var(--text);font-size:14px}
.check input{width:22px;height:22px;margin:0;accent-color:var(--gold);flex-shrink:0}
.check small{display:block;color:var(--muted);font-size:12.5px}
.listbox{list-style:none;margin:4px 0 0;padding:6px;border-radius:12px;background:var(--card2);border:1px solid rgba(240,205,115,.4);position:absolute;top:100%;left:0;right:0;z-index:5}
.listbox li{min-height:52px;padding:6px 12px;border-radius:9px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.listbox li b{color:var(--text);font-weight:500}
.listbox li span{font-size:13px}
.listbox li[aria-selected=true]{background:rgba(240,205,115,.14)}
.listbox .foot{min-height:auto;cursor:default;font-size:12.5px;padding:8px 12px 4px}
details.plain summary{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;color:var(--gold);list-style:none;width:max-content}
details summary::-webkit-details-marker{display:none}
details .body{display:flex;flex-direction:column;gap:8px;padding:4px 0 8px;font-size:14px;max-width:60ch}
details.box{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:0 18px}
details.box>summary{display:flex;align-items:center;justify-content:space-between;min-height:56px;cursor:pointer;list-style:none;color:var(--text);font-size:15px}
details.box>summary .chev,details.plain>summary .chev{transition:transform .15s}
details[open]>summary .chev{transform:rotate(180deg)}
.space{position:relative}
.space-cap{font-family:var(--display);font-size:22px;line-height:1.3;color:var(--gold);max-width:22ch}
.space-sub{margin-top:10px;max-width:40ch}
.space svg{width:100%;max-width:520px;display:block;margin:32px auto 0}

/* result */
.res-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;justify-content:space-between}
.meta{margin-top:12px;color:var(--text);font-size:16px}
.meta2{font-size:14px;margin-top:2px}
.res-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:48px;margin-top:36px;align-items:start}
.wheel-box{display:flex;flex-direction:column;gap:12px}
.wheel-box svg{width:100%;height:auto;display:block;touch-action:manipulation}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.panel{padding:28px;display:flex;flex-direction:column;gap:18px}
.acc{display:flex;align-items:center;gap:16px;min-height:76px;padding:12px 16px;border-radius:var(--radius);background:var(--bg);border:1px solid var(--line);text-decoration:none;color:inherit}
.acc:hover{border-color:rgba(240,205,115,.5);color:inherit}
.acc .ico{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--gold);font-size:22px}
.acc .ico.txt{font:500 13px var(--display);letter-spacing:.04em}
.acc .lbl{font-size:13px}
.acc .val{color:var(--gold);font-size:18px}
.acc.dashed,.acc.dashed .ico{border-style:dashed}
.acc.dashed .val{color:var(--text);font-size:15px}
.rowgap{display:flex;flex-wrap:wrap;gap:8px}
.stack{display:flex;flex-direction:column;gap:10px}
.small{font-size:13px}

/* detail */
.det-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;margin-top:32px;align-items:start}
.sticky{position:sticky;top:96px}
.sel-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 6px 6px 14px;border-radius:12px;background:var(--card);border:1px solid rgba(240,205,115,.5);color:var(--text);font-size:14px;min-height:56px}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);flex-shrink:0;text-decoration:none}
.iconbtn:hover{color:var(--gold);border-color:rgba(240,205,115,.5)}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.key{padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.key .lbl{font-size:12.5px}
.key .val{color:var(--gold);font-size:16px}
.sec{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.3fr) minmax(0,.7fr);gap:12px;align-items:center;min-height:52px;padding:6px 10px;border:1px solid transparent;border-bottom-color:var(--line2);background:transparent;text-align:left;cursor:pointer;width:100%;color:var(--muted)}
.row .nm{color:var(--text)}
.row:hover{background:rgba(240,205,115,.04)}
.row.on{background:rgba(240,205,115,.13);border-color:rgba(240,205,115,.6);border-radius:10px;color:var(--text)}
.row.dim{opacity:.45}
.arow{grid-template-columns:minmax(0,1fr) auto}
.arow .sub{font-size:13px;color:var(--muted);display:block}
.show-on-map{display:none}
.tag{font-size:11.5px;color:var(--red);margin-left:6px}
.empty{padding:18px;border-radius:12px;border:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.empty b{color:var(--text);font-weight:500}

/* chat (M2) */
.chat{display:grid;grid-template-columns:260px minmax(0,1fr) 340px;height:calc(100vh - 73px);height:calc(100dvh - 73px)}
.chat>aside,.chat>section{min-height:0}
.dlg{border-right:1px solid var(--line2);padding:20px 16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.dlg .item{padding:10px 12px;border-radius:10px;background:rgba(240,205,115,.07);color:var(--text)}
.dlg .item small{display:block;color:var(--muted)}
.conv{display:flex;flex-direction:column;min-height:0}
.conv-head{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line2)}
.conv-head .t{flex:1;min-width:0}
.conv-head .t div{font:400 20px var(--display);color:var(--gold)}
.msgs{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px;max-width:760px;width:100%;margin:0 auto}
.who{display:flex;align-items:center;gap:8px;color:var(--gold);font-size:13px;font-weight:600}
.bub{padding:14px 16px;border-radius:4px 16px 16px 16px;background:var(--card);border:1px solid var(--line);color:var(--text);max-width:62ch}
.bub.me{align-self:flex-end;border-radius:16px 4px 16px 16px;background:#2A1A12;border-color:rgba(208,123,88,.45)}
.bub .ph{color:var(--muted)}
.fact{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid rgba(240,205,115,.45);font-size:13px;color:var(--gold)}
.composer{padding:12px 24px 18px;border-top:1px solid var(--line2)}
.composer-in{display:flex;gap:10px;align-items:flex-end;max-width:760px;margin:0 auto}
.composer textarea{flex:1;min-height:52px;max-height:160px;padding:14px 16px;border-radius:var(--radius);border:1px solid rgba(224,179,87,.35);background:var(--card);color:var(--text);font:16px var(--body);resize:none}
.composer textarea:focus{outline:none;border-color:var(--gold)}
.send{width:52px;height:52px;border-radius:var(--radius);border:0;background:var(--gold);color:var(--on-gold);display:flex;align-items:center;justify-content:center;cursor:pointer}
.side .acc .val{font-size:16px}
.side{border-left:1px solid var(--line2);padding:20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.chat-toggle{display:none}

/* prototype panel */
.proto{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;max-width:300px}
.proto details{background:var(--card2);border:1px solid var(--red);border-radius:12px;padding:0 14px;font-size:13px}
.proto summary{min-height:44px;display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--red);list-style:none}
.proto .body{padding:0 0 12px;gap:10px}
.proto select{width:100%;min-height:40px;border-radius:8px;background:var(--bg);color:var(--text);border:1px solid var(--line);padding:0 8px;font:14px var(--body)}
.proto .rowgap .chip{min-height:36px;padding:0 12px;font-size:13px}

@media (max-width:1024px){
  .intro,.res-grid,.det-grid{grid-template-columns:1fr;gap:32px}
  .space svg{max-width:320px;margin-top:16px}
  .sticky{position:static}
  .show-on-map{display:inline-flex}
  .chat{grid-template-columns:minmax(0,1fr)}
  .dlg{display:none}
  .side{display:none;border-left:0}
  .chat.show-side .conv{display:none}
  .chat.show-side .side{display:flex}
  .chat-toggle{display:inline-flex}
}
@media (max-width:600px){
  .top-in,.wrap{padding-left:16px;padding-right:16px}
  .wrap{padding-top:24px}
  .form,.panel{padding:18px}
  .two{grid-template-columns:1fr}
  .keys{grid-template-columns:1fr}
  .top .badge{display:none}
  .tl{display:none}
  .space{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto}
  .row .hs{display:none}
  .msgs,.composer{padding-left:14px;padding-right:14px}
  .conv-head{padding:10px 14px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="logo" href="#" data-go="home" aria-label="exact orb, на главную">
      <svg width="30" height="30" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="10.5" fill="none" stroke="#F0CD73" stroke-width="1.4"/><circle cx="14" cy="14" r="4" fill="#F0CD73"/><path d="M14 1v5M14 22v5M1 14h5M22 14h5" stroke="#F0CD73" stroke-width="1.4"/></svg>
      exact orb
    </a>
    <span class="badge">Прототип · демо-данные</span>
    <span class="spacer"></span>
    <span id="topAction"></span>
  </div>
</header>

<main id="app" tabindex="-1"></main>
<div id="live" class="sr" aria-live="polite"></div>

<div class="proto">
  <details>
    <summary>Прототип: состояние сессии</summary>
    <div class="body" style="display:flex;flex-direction:column">
      <label for="protoState" class="small">Что вернул bootstrap</label>
      <select id="protoState">
        <option value="empty">empty — сессия пустая</option>
        <option value="ready">chart_ready — карта готова</option>
        <option value="notime">chart_ready — время неизвестно</option>
        <option value="stale">chart_ready + chart_stale</option>
        <option value="unavailable">chart_unavailable</option>
      </select>
      <button class="chip" id="protoReload" type="button">Открыть страницу заново</button>
      <p class="small">Карта в прототипе — вымышленная фикстура. Она не зависит от введённых данных.</p>
    </div>
  </details>
</div>

 {id:"al",name:"Алматы",admin:"Алматы",cc:"Казахстан"},{id:"ek",name:"Екатеринбург",admin:"Свердловская обл.",cc:"Россия"}];

function say(t){live.textContent="";setTimeout(function(){live.textContent=t;},30);}
var mqCompact=window.matchMedia("(max-width:600px)");

/* ---------- wheel ---------- */
var CX=320,CY=320,R0=290,R1=252,RA=128;
function pt(l,r,ref){var a=(180+l-ref)*Math.PI/180;return[CX+r*Math.cos(a),CY-r*Math.sin(a)];}
function f1(n){return n.toFixed(1);}
function ln(l1,r1,l2,r2,ref,attrs){var a=pt(l1,r1,ref),b=pt(l2,r2,ref);return '<line x1="'+f1(a[0])+'" y1="'+f1(a[1])+'" x2="'+f1(b[0])+'" y2="'+f1(b[1])+'" '+attrs+"/>";}
function spread(ms){
  var arr=P.map(function(p){return{id:p.id,d:p.lon};}).sort(function(a,b){return a.d-b.d;});
  for(var it=0;it<100;it++){var mv=false;for(var i=0;i<arr.length;i++){var j=(i+1)%arr.length,gap=(((arr[j].d-arr[i].d)%360)+540)%360-180;if(gap<ms-0.01){var q=(ms-gap)/2;arr[i].d-=q;arr[j].d+=q;mv=true;}}if(!mv)break;}
  var o={};arr.forEach(function(a){o[a.id]=((a.d%360)+360)%360;});return o;
}
function relA(i){var s=S.sel;if(!s)return false;return s.t==="p"?(A[i][0]===s.id||A[i][1]===s.id):i===s.i;}
function hiP(id){var s=S.sel;if(!s)return false;if(s.t==="a")return A[s.i][0]===id||A[s.i][1]===id;
  if(id===s.id)return true;for(var i=0;i<A.length;i++){if(relA(i)&&(A[i][0]===id||A[i][1]===id))return true;}return false;}
function hasTime(){return S.session!=="notime";}
function wheel(opt){
  var houses=hasTime(), full=opt.full && !mqCompact.matches, ref=houses?100:0, hs=!!S.sel && opt.interactive;
  var RG=full?214:210, rr=full?17:22, gfs=full?22:28, sfs=full?20:25;
  var o=['<svg viewBox="-34 -34 708 708" role="img" aria-label="'+esc(opt.label)+'" data-wheel="'+(opt.interactive?1:0)+'" data-ref="'+ref+'">'];
  o.push('<circle cx="320" cy="320" r="'+R0+'" fill="#15110E" stroke="#E0B357" stroke-width="1.2"/>');
  o.push('<circle cx="320" cy="320" r="'+R1+'" fill="none" stroke="#E0B357"/>');
  if(houses&&full)o.push('<circle cx="320" cy="320" r="146" fill="none" stroke="rgba(224,179,87,.3)"/>');
  o.push('<circle cx="320" cy="320" r="'+RA+'" fill="#080706" stroke="rgba(224,179,87,.3)"/>');
  for(var i=0;i<12;i++){
    o.push(ln(i*30,R1,i*30,R0,ref,'stroke="#E0B357" stroke-width=".8" stroke-opacity=".6"'));
    var sp=pt(i*30+15,271,ref);o.push('<text x="'+f1(sp[0])+'" y="'+f1(sp[1])+'" dy=".35em" text-anchor="middle" font-size="'+sfs+'" fill="#E0B357" font-family=\'Noto Sans Symbols,Noto Sans Symbols 2,Segoe UI Symbol,sans-serif\'>'+SIGNS[i][0]+VS+"</text>");
  }
  if(full){for(var d=0;d<360;d++){if(d%30===0)continue;var L=d%10===0?7:d%5===0?4.5:2;o.push(ln(d,R1,d,R1-L,ref,'stroke="#E0B357" stroke-opacity=".45" stroke-width=".6"'));}}
  if(houses){
    CUSPS.forEach(function(c,i){var ag=i%3===0;o.push(ln(c,RA,c,ag?R0:R1,ref,'stroke="'+(ag?"#F0CD73":"rgba(224,179,87,.3)")+'" stroke-width="'+(ag?1.6:1)+'"'));
      if(full){var n=CUSPS[(i+1)%12],spn=((n-c)%360+360)%360,q=pt(c+spn/2,137,ref);o.push('<text x="'+f1(q[0])+'" y="'+f1(q[1])+'" dy=".35em" text-anchor="middle" font-size="13" fill="#B8AA97" font-family="Manrope,sans-serif">'+(i+1)+"</text>");}});
    ANG.forEach(function(a){var q=pt(a[1],316,ref);o.push('<text x="'+f1(q[0])+'" y="'+f1(q[1])+'" dy=".35em" text-anchor="middle" font-size="'+(full?18:22)+'" fill="#F0CD73" font-family="Jost,sans-serif" letter-spacing=".5">'+a[0]+"</text>");});
  }
  A.forEach(function(a,i){
    if(a[2]==="conj")return;
    var k=T[a[2]][2], mu=!houses&&(a[0]==="moon"||a[1]==="moon"), r=relA(i);
    var col=k==="tense"?"#D07B58":k==="harm"?"#F0CD73":"#E0B357";
    var dash=mu?"3 7":k==="tense"?"10 7":k==="minor"?"2 6":"";
    var op=hs?(r?1:0.07):(mu?0.35:k==="harm"?0.55:0.85), w=hs&&r?3:1.4;
    var p1=pt(B[a[0]].lon,RA,ref),p2=pt(B[a[1]].lon,RA,ref);
    var c='x1="'+f1(p1[0])+'" y1="'+f1(p1[1])+'" x2="'+f1(p2[0])+'" y2="'+f1(p2[1])+'"';
    o.push("<line "+c+' stroke="'+col+'" stroke-width="'+w+'" stroke-opacity="'+op+'"'+(dash?' stroke-dasharray="'+dash+'"':"")+' stroke-linecap="round" pointer-events="none"/>');
    if(opt.interactive&&full)o.push("<line "+c+' stroke="transparent" stroke-width="12" data-asp="'+i+'" style="cursor:pointer"/>');
  });
  var disp=spread(full?10:12);
  P.forEach(function(p){
    var dd=disp[p.id], on=hs&&hiP(p.id), dim=hs&&!on;
    var g='<g data-p="'+p.id+'" style="cursor:'+(opt.interactive?"pointer":"default")+'" opacity="'+(dim?.3:1)+'">';
    if(!houses&&p.id==="moon"){var R=R1-6,a1=pt(p.lon-6.5,R,ref),a2=pt(p.lon+6.5,R,ref);g+='<path d="M'+f1(a1[0])+" "+f1(a1[1])+" A"+R+" "+R+" 0 0 0 "+f1(a2[0])+" "+f1(a2[1])+'" fill="none" stroke="#F0CD73" stroke-width="7" stroke-opacity=".5" stroke-linecap="round"/>';}
    g+=ln(p.lon,R1,p.lon,R1-13,ref,'stroke="#F0CD73" stroke-width="2"');
    if(Math.abs((((dd-p.lon)%360)+540)%360-180)>0.3)g+=ln(p.lon,R1-13,dd,RG+rr,ref,'stroke="#E0B357" stroke-opacity=".8"');
    var q=pt(dd,RG,ref);
    g+='<circle cx="'+f1(q[0])+'" cy="'+f1(q[1])+'" r="'+rr+'" fill="#080706" stroke="'+(on?"#F0CD73":"rgba(240,205,115,.45)")+'" stroke-width="'+(on?2.6:1.2)+'"/>';
    g+='<text x="'+f1(q[0])+'" y="'+f1(q[1])+'" dy=".35em" text-anchor="middle" font-size="'+gfs+'" fill="#F0CD73" font-family=\'Noto Sans Symbols,Noto Sans Symbols 2,Segoe UI Symbol,sans-serif\'>'+p.g+VS+"</text>";
    if(full){var pq=pos(p.lon),tq=pt(dd,RG-30,ref);g+='<text x="'+f1(tq[0])+'" y="'+f1(tq[1])+'" dy=".35em" text-anchor="middle" font-size="12.5" fill="#B8AA97" font-family="Manrope,sans-serif">'+(!houses&&p.id==="moon"?"~":"")+pq.d+"°"+(p.r?"℞":"")+"</text>";}
    o.push(g+"</g>");
  });
  o.push("</svg>");return o.join("");
}

}

function aspectRow(i){

  var mu=!hasTime()&&(a[0]==="moon"||a[1]==="moon");
  var col=t[2]==="tense"?"color:var(--red)":"color:var(--gold2)";
  return '<button type="button" class="row arow'+(on?" on":hs?" dim":"")+'" data-asp="'+i+'" aria-pressed="'+!!mine+'"><span><span class="nm">'+sym(pa.g)+" "+pa.n+' <span class="sym" style="'+col+'" aria-hidden="true">'+t[0]+VS+"</span> "+sym(pb.g)+" "+pb.n+'</span><span class="sub">'+t[1]+(mu?'<span class="tag">зависит от времени</span>':"")+'</span></span><span>'+(mu?"~":"")+forb(a[3])+"</span></button>"+
    (mine?'<a class="textbtn show-on-map" href="#wheelAnchor">'+ic("up",16)+"Показать на карте</a>":"");
}
function screenDetail(){
  var t=hasTime();
  var exact=A.map(function(a,i){return i;}).filter(function(i){return A[i][4]==="exact";});
  var all=A.map(function(a,i){return i;}).filter(function(i){var k=T[A[i][2]][2];return S.aspFilter==="all"||(S.aspFilter==="harm"&&k==="harm")||(S.aspFilter==="tense"&&k==="tense");});
  var cnt=function(k){return A.filter(function(a){return T[a[2]][2]===k;}).length;};
  var selBar="";
  if(S.sel){var txt;if(S.sel.t==="p"){var p=B[S.sel.id];txt=sym(p.g)+" "+p.n+", "+fpos(p.lon);}else{var a=A[S.sel.i];txt=sym(B[a[0]].g)+" "+B[a[0]].n+" "+T[a[2]][1]+" "+sym(B[a[1]].g)+" "+B[a[1]].n+", "+forb(a[3]);}
    selBar='<div class="sel-bar"><span>Выбрано: '+txt+'</span><button class="iconbtn" type="button" data-act="clear" aria-label="Снять выделение">'+ic("x")+"</button></div>";}
  var houses=t?CUSPS.map(function(c,i){return '<div style="display:flex;justify-content:space-between;min-height:44px;align-items:center;border-bottom:1px solid var(--line2)"><span style="color:var(--text)">'+(i+1)+" дом</span><span>"+fpos(c)+"</span></div>";}).join(""):'<div class="empty"><b>Дома не рассчитаны</b><span>Для домов нужно время рождения.</span></div>';
  return '<div class="wrap"><button class="textbtn" type="button" data-go="ready" style="padding:0">'+ic("left")+"К карте</button>"+
    '<h1 style="margin-top:12px">Ваша натальная карта</h1>'+metaLine()+
    '<div class="det-grid"><div class="sticky" id="wheelAnchor"><div class="wheel-box">'+wheel({full:true,interactive:true,label:"Натальная карта. Выберите планету или аспект; все значения есть в списках справа."})+legend()+selBar+"</div></div>"+
    "<div>"+
      '<div class="keys"><div class="key"><div class="lbl">Солнце</div><div class="val">'+fpos(B.sun.lon)+(t?", 3 дом":"")+'</div></div><div class="key"><div class="lbl">Луна</div><div class="val">'+(t?fpos(B.moon.lon)+", 10 дом":"Овен ~21°")+'</div></div><div class="key"><div class="lbl">Асцендент</div><div class="val">'+(t?fpos(100):'<span style="color:var(--muted)">нужно время</span>')+"</div></div></div>"+
      '<section class="sec" aria-labelledby="h-pl"><h2 id="h-pl">Планеты</h2><div class="rows">'+planetRows()+"</div></section>"+
      '<section class="sec" aria-labelledby="h-as"><h2 id="h-as">Аспекты</h2>'+
        '<h3>Точные · '+exact.length+'</h3><p class="small">Точными движок считает аспекты с категорией «exact».</p>'+
        (exact.length?'<div class="rows">'+exact.map(aspectRow).join("")+"</div>":'<div class="empty"><b>Точных аспектов нет</b><span>Полный список ниже.</span></div>')+
        '<details class="box" style="margin-top:8px"'+(S.allOpen?" open":"")+' id="allAsp"><summary>Все аспекты · '+A.length+'<span class="chev">'+ic("down",18)+'</span></summary><div class="body" style="max-width:none">'+
          '<div class="rowgap" role="group" aria-label="Фильтр аспектов">'+[["all","Все · "+A.length],["harm","Гармоничные · "+cnt("harm")],["tense","Напряжённые · "+cnt("tense")]].map(function(x){return '<button type="button" class="chip" data-filter="'+x[0]+'" aria-pressed="'+(S.aspFilter===x[0])+'">'+x[1]+"</button>";}).join("")+"</div>"+
          '<div class="rows">'+all.map(aspectRow).join("")+"</div></div></details></section>"+
      '<section class="sec" aria-labelledby="h-ho"><h2 id="h-ho">Дома</h2><details class="box"><summary>Куспиды домов<span class="chev">'+ic("down",18)+'</span></summary><div class="body" style="max-width:none">'+houses+"</div></details></section>"+
      '<section class="sec" aria-labelledby="h-el"><h2 id="h-el">Стихии</h2><div class="empty"><b>Методика подсчёта не утверждена</b><span>Когда она появится, здесь будут числа с пояснением: какие планеты учтены, с какими весами и от какого итога считаются доли.</span></div></section>'+
    "</div></div></div>";
}
function screenChat(){
  var msgs='<div class="who">'+ic("star",14)+"exact orb</div>"+
    '<div class="bub">Карта рассчитана. Выберите тему или задайте вопрос: ответы опираются только на рассчитанные положения.</div>'+
    '<div class="rowgap">'+["Характер","Карьера","Отношения"].map(function(t){return '<button class="chip" type="button" data-topic="'+t+'">'+t+"</button>";}).join("")+"</div>"+
    '<div class="bub me">Расскажи про карьеру. И кстати, я родилась 6 сентября, а не 5.</div>'+
    '<div class="who">'+ic("star",14)+'exact orb</div><div class="note" role="note"><div class="stack" style="gap:4px"><b>В сообщении другая дата</b><span>Карта сама не меняется — ответ ниже построен по текущей карте.</span><button class="textbtn" type="button" data-go="edit" style="padding:0">'+ic("edit",18)+"Изменить данные рождения</button></div></div>"+
    '<div class="bub"><span class="ph">[Интерпретация — блок H ещё не реализован. Ответ будет ссылаться на факты карты.]</span><div class="rowgap" style="margin-top:10px"><span class="fact">'+sym("☉")+' Дева, 3 дом</span><span class="fact">MC, Рыбы 28°</span></div></div>'+
    S.chat.map(function(m){return m.me?'<div class="bub me">'+esc(m.t)+"</div>":'<div class="who">'+ic("star",14)+'exact orb</div><div class="bub"><span class="ph">'+esc(m.t)+"</span></div>";}).join("")+
    '<div class="small" style="display:flex;align-items:center;gap:8px"><span style="width:6px;height:6px;border-radius:50%;background:var(--gold)"></span>Основано на текущей карте: '+META.date+", "+META.time+"</div>";
  return '<div class="chat'+(S.showSide?" show-side":"")+'">'+
    '<aside class="dlg" aria-label="Диалоги"><button class="btn secondary" type="button" disabled style="min-height:44px;font-size:14px">Новый диалог</button><div class="item">Персональный разбор<small>Натальная карта, сейчас</small></div><p class="small">Модель нескольких диалогов — решение до M2.</p></aside>'+
    '<section class="conv" aria-label="Переписка"><div class="conv-head"><div class="t"><div>Персональный разбор <span class="badge m2">M2</span></div><span class="small">карта от '+META.date+", "+META.time+'</span></div><button class="iconbtn chat-toggle" type="button" data-act="side" aria-label="Открыть карту">'+ic("chart")+'</button></div>'+
      '<div class="msgs" id="msgs">'+msgs+"</div>"+
      '<form class="composer" id="composer"><div class="composer-in"><label for="q" class="sr">Вопрос о карте</label><textarea id="q" rows="1" placeholder="Вопрос о вашей карте"></textarea><button class="send" type="submit" aria-label="Отправить">'+ic("send")+"</button></div><p class=\"small\" style=\"max-width:760px;margin:6px auto 0\">Enter — отправить, Shift + Enter — новая строка</p></form></section>"+
    '<aside class="side" aria-label="Ваша карта"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px"><div><h2>Ваша карта</h2><span class="small">'+META.date+", "+META.time+'</span></div><button class="iconbtn chat-toggle" type="button" data-act="side" aria-label="Закрыть карту">'+ic("x")+"</button></div>"+
      '<div style="max-width:300px;width:100%;align-self:center">'+wheel({full:false,interactive:false,label:"Компактная натальная карта. Ключевые положения ниже."})+"</div>"+
      '<div class="stack">'+accentCards("detail")+"</div>"+
      '<div class="stack small"><span style="color:var(--text)">Точность расчёта</span><span style="display:flex;gap:8px">'+ic("check",18)+META.tz+", определён движком</span><span style=\"display:flex;gap:8px\">"+ic("check",18)+(hasTime()?"Время известно: дома и углы рассчитаны":"Время неизвестно: дома и углы не рассчитаны")+"</span></div>"+
      '<a class="btn secondary" href="#" data-go="detail">Открыть карту полностью</a></aside></div>';
}

/* ---------- render / routing ---------- */
function render(){
  var html=S.screen==="input"?screenInput():S.screen==="unavailable"?screenUnavailable():S.screen==="detail"?screenDetail():S.screen==="chat"?screenChat():screenReady();
  var y=window.scrollY;app.innerHTML=html;topAction();
  if(S.screen!=="chat")window.scrollTo(0,y);
  if(S.focus){var el=app.querySelector(S.focus);if(el)el.focus({preventScroll:true});S.focus=null;}
}
function go(screen,opts){
  S.screen=screen;S.sel=null;S.showSide=false;render();
  if(!opts||!opts.keepScroll)window.scrollTo(0,0);
  var h=app.querySelector("h1");if(h&&(!opts||!opts.noFocus)){h.setAttribute("tabindex","-1");h.focus({preventScroll:true});}
}
function bootstrap(){
  var k=S.session;
  if(k==="empty")go("input");else if(k==="unavailable")go("unavailable");else go("ready");
  say(k==="empty"?"Сессия пустая: введите данные рождения.":k==="unavailable"?"Сохранённую карту не удалось открыть.":"Карта загружена.");
}

/* ---------- form logic ---------- */
function validDate(s){
  var m=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec(s);if(!m)return "Введите дату в формате ДД.ММ.ГГГГ.";
  var d=+m[1],mo=+m[2],y=+m[3],dt=new Date(y,mo-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return "Такой даты нет. Проверьте день и месяц.";
  if(dt>new Date())return "Дата рождения не может быть в будущем.";
  if(y<1900)return "Даты раньше 1900 года пока не поддерживаются.";
  return "";
}
function maskDate(v){var d=v.replace(/\D/g,"").slice(0,8),o=d.slice(0,2);if(d.length>2)o+="."+d.slice(2,4);if(d.length>4)o+="."+d.slice(4);return o;}
function maskTime(v){var d=v.replace(/\D/g,"").slice(0,4);return d.length>2?d.slice(0,2)+":"+d.slice(2):d;}
function validTime(s){if(!s)return "";var m=/^(\d{2}):(\d{2})$/.exec(s);if(!m||+m[1]>23||+m[2]>59)return "Введите время в формате ЧЧ:ММ или отметьте, что оно неизвестно.";return "";}
function searchPlaces(q){q=q.trim().toLowerCase();if(q.length<2)return null;return CATALOG.filter(function(c){return c.name.toLowerCase().indexOf(q)===0;}).slice(0,10);}
function refreshInput(focusSel,caret){
  render();var el=app.querySelector(focusSel);if(el){el.focus();if(caret!=null&&el.setSelectionRange)el.setSelectionRange(caret,caret);}
}
function submitForm(){
  var f=S.form,e={};
  e.date=validDate(f.date);
  if(!f.place)e.place=f.placeQuery?"Выберите город из списка — так мы узнаем его координаты.":"Укажите место рождения и выберите его из подсказок.";
  if(!f.unknown)e.time=validTime(f.time);
  Object.keys(e).forEach(function(k){if(!e[k])delete e[k];});
  S.errors=e;
  if(Object.keys(e).length){var first=Object.keys(e)[0];S.errors.form="Проверьте отмеченные поля.";render();var el=app.querySelector("#f-"+first);if(el)el.focus();say("Форма не отправлена: "+e[first]);return;}
  S.errors={};S.busy=true;render();say("Строим карту");
  setTimeout(function(){S.busy=false;S.session=(f.unknown||!f.time)?"notime":"ready";document.getElementById("protoState").value=S.session;go("ready");say("Карта готова.");},1100);
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var g=e.target.closest("[data-go]");
  if(g){e.preventDefault();var to=g.getAttribute("data-go");
    if(to==="home"){bootstrap();return;}
    if(to==="edit"){if(S.session!=="empty"&&!S.form.date){S.form.date="05.09.1988";S.form.place=CATALOG[0];S.form.time=S.session==="notime"?"":"04:40";S.form.unknown=S.session==="notime";}S.errors={};go("input");return;}
    go(to);return;}
  var act=e.target.closest("[data-act]");
  if(act){var a=act.getAttribute("data-act");
    if(a==="clear"){S.sel=null;render();say("Выделение снято");}
    if(a==="side"){S.showSide=!S.showSide;render();}
    if(a==="recalc"&&!S.busy){S.busy=true;render();say("Строим карту");setTimeout(function(){S.busy=false;S.session="ready";document.getElementById("protoState").value="ready";go("ready");say("Карта пересчитана.");},1100);}
    return;}
  var opt=e.target.closest("[data-opt]");
  if(opt){pickPlace(+opt.getAttribute("data-opt"));return;}
  var fl=e.target.closest("[data-filter]");
  if(fl){S.aspFilter=fl.getAttribute("data-filter");S.allOpen=true;S.focus='[data-filter="'+S.aspFilter+'"]';render();return;}
  var tp=e.target.closest("[data-topic]");
  if(tp){S.chat.push({me:1,t:tp.getAttribute("data-topic")});S.chat.push({t:"[Ответ по теме «"+tp.getAttribute("data-topic")+"» появится вместе с интерпретацией в M2.]"});render();var m=document.getElementById("msgs");m.scrollTop=m.scrollHeight;return;}
  if(S.screen!=="detail")return;
  var pr=e.target.closest("[data-p]"),ar=e.target.closest("[data-asp]");
  if(pr){var id=pr.getAttribute("data-p");S.sel=(S.sel&&S.sel.t==="p"&&S.sel.id===id)?null:{t:"p",id:id};if(pr.tagName==="BUTTON")S.focus='button[data-p="'+id+'"]';render();say(S.sel?"Выбрано: "+B[id].n:"Выделение снято");return;}
  if(ar){var i=+ar.getAttribute("data-asp");S.sel=(S.sel&&S.sel.t==="a"&&S.sel.i===i)?null:{t:"a",i:i};if(ar.tagName==="BUTTON")S.focus='button[data-asp="'+i+'"]';if(ar.closest("#allAsp"))S.allOpen=true;render();say(S.sel?"Выбран аспект":"Выделение снято");return;}
  var svg=e.target.closest('svg[data-wheel="1"]');
  if(svg){ /* нажатие в секторе кольца → ближайшая планета по углу */
    var pt0=svg.createSVGPoint();pt0.x=e.clientX;pt0.y=e.clientY;var q=pt0.matrixTransform(svg.getScreenCTM().inverse());
    var dx=q.x-CX,dy=CY-q.y,r=Math.hypot(dx,dy);
    if(r>RA&&r<R0+10){var ref=+svg.getAttribute("data-ref"),lon=((Math.atan2(dy,dx)*180/Math.PI-180+ref)%360+360)%360,best=null,bd=99;
      P.forEach(function(p){var d=Math.abs((((p.lon-lon)%360)+540)%360-180);if(d<bd){bd=d;best=p;}});
      if(best&&bd<14){S.sel={t:"p",id:best.id};render();say("Выбрано: "+best.n);return;}}
    if(S.sel){S.sel=null;render();say("Выделение снято");}
  }
});
function pickPlace(i){var it=S.ac.items[i];if(!it)return;S.form.place=it;S.form.placeQuery="";S.ac.open=false;delete S.errors.place;refreshInput("#f-place");say("Выбрано: "+it.name+", "+it.admin);}
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="f-date"){var v=maskDate(t.value);S.form.date=v;t.value=v;if(S.errors.date){delete S.errors.date;refreshInput("#f-date",v.length);}}
  else if(t.id==="f-time"){var v2=maskTime(t.value);S.form.time=v2;t.value=v2;if(S.errors.time){delete S.errors.time;refreshInput("#f-time",v2.length);}}
  else if(t.id==="f-name"){S.form.name=t.value;}
  else if(t.id==="f-place"){S.form.place=null;S.form.placeQuery=t.value;var r=searchPlaces(t.value);S.ac.open=r!==null;S.ac.items=r||[];S.ac.active=0;delete S.errors.place;refreshInput("#f-place",t.value.length);}
});
document.addEventListener("change",function(e){
  if(e.target.id==="f-unknown"){S.form.unknown=e.target.checked;if(S.form.unknown){S.form.time="";delete S.errors.time;}refreshInput("#f-unknown");}
  if(e.target.id==="f-consent"){S.form.consent=e.target.checked;}
  if(e.target.id==="protoState"){S.session=e.target.value;}
});
document.addEventListener("keydown",function(e){
  if(e.target.id==="f-place"&&S.ac.open&&S.ac.items.length){
    if(e.key==="ArrowDown"){e.preventDefault();S.ac.active=(S.ac.active+1)%S.ac.items.length;refreshInput("#f-place",e.target.value.length);}
    else if(e.key==="ArrowUp"){e.preventDefault();S.ac.active=(S.ac.active-1+S.ac.items.length)%S.ac.items.length;refreshInput("#f-place",e.target.value.length);}
    else if(e.key==="Enter"){e.preventDefault();pickPlace(S.ac.active);}
    else if(e.key==="Escape"){S.ac.open=false;refreshInput("#f-place",e.target.value.length);}
    return;}
  if(e.target.id==="q"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();document.getElementById("composer").requestSubmit();return;}
  if(e.key==="Escape"&&S.sel){S.sel=null;render();say("Выделение снято");}
});
document.addEventListener("submit",function(e){
  if(e.target.id==="birthForm"){e.preventDefault();if(!S.busy)submitForm();}
  if(e.target.id==="composer"){e.preventDefault();var q=document.getElementById("q"),v=q.value.trim();if(!v)return;S.chat.push({me:1,t:v});S.chat.push({t:"[Ответ появится вместе с интерпретацией в M2.]"});render();var m=document.getElementById("msgs");m.scrollTop=m.scrollHeight;document.getElementById("q").focus();}
});
document.getElementById("protoReload").addEventListener("click",function(){S.form={date:"",time:"",unknown:false,name:"",placeQuery:"",place:null,consent:false};S.errors={};S.chat=[];bootstrap();});
function onMq(){if(S.screen!=="input")render();}
if(mqCompact.addEventListener)mqCompact.addEventListener("change",onMq);else mqCompact.addListener(onMq);

bootstrap();
})();
</script>
</body>
